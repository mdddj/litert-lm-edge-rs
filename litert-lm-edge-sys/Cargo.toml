[package]
name = "litert-lm-edge-sys"
description = "Raw FFI bindings for the LiteRT-LM C API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "litert_lm_c_api"
build = "build.rs"
# The bundled runtimes are ~200 MB per crate and far exceed the crates.io
# 10 MB limit. They are published as GitHub Release assets instead and fetched
# by build.rs when no local `vendor/<platform>` directory is present.
exclude = ["vendor/**", "default.profraw"]

[features]
default = [
    "vendor-darwin-arm64",
    "vendor-linux-x86_64",
    "vendor-windows-x86_64",
]
generate-bindings = ["dep:bindgen"]
system = []
vendor-darwin-arm64 = []
vendor-linux-x86_64 = []
vendor-windows-x86_64 = []

[build-dependencies]
bindgen = { version = "0.71", optional = true }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[lints]
workspace = true
