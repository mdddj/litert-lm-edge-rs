[workspace]
members = [
    "litert-lm-edge",
    "litert-lm-edge-sys",
    "litert-lm-edge-ue-ffi",
]
resolver = "2"

[workspace.dependencies]
litert-lm-edge = { version = "0.2.3", path = "litert-lm-edge", default-features = false }
litert-lm-edge-sys = { version = "0.2.3", path = "litert-lm-edge-sys", default-features = false }

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/mdddj/litert-lm-edge-rs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
